services:
  - type: web
    name: zonematrix-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: zonematrix-db
          property: connectionString
      # Free tier has no preDeployCommand, so the API applies schema.sql on
      # boot instead (idempotent; see init_db.py + main.py startup).
      - key: DB_INIT_ON_START
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000

databases:
  - name: zonematrix-db
    plan: free
    region: oregon
    databaseName: db_zone
